name: Build SukiSU Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: '设备代号'
        required: true
        default: 'oneplus_ace5_ultra'
        type: choice
        options:
          - oneplus_ace5_ultra
      cpu:
        description: '处理器代号'
        required: true
        default: 'MT6991'
        type: choice
        options:
          - MT6991
      kernel:
        description: '内核版本'
        required: true
        default: '6.6'
        type: choice
        options:
          - 6.6
      kpm:
        description: '开启 KPM'
        required: true
        default: 'y'
        type: choice
        options:
          - y
          - n
      susfs:
        description: '开启 SUSFS (一加禁止开启)'
        required: true
        default: 'n'
        type: choice
        options:
          - y
          - n

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置环境
        run: |
          sudo apt update
          sudo apt install -y git-core clang llvm lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev python3-pip
          pip3 install pycryptodome

      - name: 下载内核源码
        run: |
          # 拉取一加 Ace 5 系列 GKI 6.6 源码
          git clone --depth=1 --branch=android14-6.6-gki https://github.com/OnePlusOSS/android_kernel_oneplus_mt6991.git kernel
          cd kernel
          git fetch --tags

      - name: 应用 SukiSU 补丁
        run: |
          cd kernel
          # 克隆 SukiSU 补丁
          git clone --depth=1 https://github.com/SukiSU/SukiSU-Ultra.git sukisu
          # 应用补丁
          patch -p1 < sukisu/patches/6.6/sukisu.patch
          [ "${{ github.event.inputs.kpm }}" = "y" ] && patch -p1 < sukisu/patches/6.6/kpm.patch

      - name: 配置编译参数
        run: |
          cd kernel
          # 设置交叉编译工具链
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          # 加载默认配置
          make oneplus_defconfig
          # 关闭 SUSFS (关键)
          [ "${{ github.event.inputs.susfs }}" = "n" ] && scripts/config --disable CONFIG_SUSFS
          # 开启 KPM
          [ "${{ github.event.inputs.kpm }}" = "y" ] && scripts/config --enable CONFIG_KPM
          # 保存配置
          make savedefconfig

      - name: 编译内核
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          # 开始编译 (使用最大线程)
          make -j$(nproc) Image.gz dtbo.img
          # 打包为 AnyKernel3 格式
          mkdir -p ../AnyKernel3
          cp arch/arm64/boot/Image.gz ../AnyKernel3/
          cp arch/arm64/boot/dtbo.img ../AnyKernel3/
          # 克隆 AnyKernel3 模板
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ../AnyKernel3-Template
          cp -r ../AnyKernel3-Template/* ../AnyKernel3/
          # 修改 updater-script 适配
          echo "ui_print(\"Flashing SukiSU Kernel for OnePlus Ace 5 Ultra...\");" > ../AnyKernel3/META-INF/com/google/android/updater-script
          echo "package_extract_file(\"Image.gz\", \"/dev/block/bootdevice/by-name/boot\");" >> ../AnyKernel3/META-INF/com/google/android/updater-script
          echo "package_extract_file(\"dtbo.img\", \"/dev/block/bootdevice/by-name/dtbo\");" >> ../AnyKernel3/META-INF/com/google/android/updater-script
          echo "ui_print(\"Kernel flashed successfully!\");" >> ../AnyKernel3/META-INF/com/google/android/updater-script

      - name: 打包发布
        run: |
          cd AnyKernel3
          zip -r9 ../SukiSU-Ace5-Ultra-${{ github.run_id }}.zip . -x "*.git*" "*.md" "LICENSE"
          cd ..

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3.zip
          path: SukiSU-Ace5-Ultra-${{ github.run_id }}.zip
          retention-days: 7
