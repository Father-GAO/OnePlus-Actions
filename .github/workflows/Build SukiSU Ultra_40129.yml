name: Build Kernel Only

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device codename
        required: true
        default: oneplus_ace5_ultra_b
        type: choice
        options:
          - oneplus_ace5_ultra_b
      cpu:
        description: CPU codename
        required: true
        default: MT6991
        type: choice
        options:
          - MT6991
      kernel:
        description: Kernel version
        required: true
        default: '6.6'
        type: choice
        options:
          - '6.6'
      kpm:
        description: Enable KPM (y/n)
        required: true
        default: 'y'
        type: choice
        options:
          - 'y'
          - 'n'
      susfs:
        description: Enable SUSFS (oneplus=n)
        required: true
        default: 'n'
        type: choice
        options:
          - 'y'
          - 'n'

jobs:
  compile_kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KERNEL_REPO: "https://github.com/ParticleG/android_kernel_oneplus_mt6991.git"
      SUKISU_REPO: "https://github.com/SukiSU/SukiSU-Ultra.git"
      ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y git-core clang llvm lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev python3-pip
          pip3 install pycryptodome
          git config --global --unset-all
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git config --global http.sslVerify false

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 $KERNEL_REPO kernel
          cd kernel || exit 1

      - name: Apply SukiSU 40129 Patches
        run: |
          cd kernel || exit 1
          git clone --depth=1 $SUKISU_REPO sukisu
          patch -p1 < sukisu/patches/6.6/sukisu.patch
          patch -p1 < sukisu/patches/6.6/40129.patch
          if [ "${{ github.event.inputs.kpm }}" = "y" ]; then
            patch -p1 < sukisu/patches/6.6/kpm.patch
          fi

      - name: Configure Build
        run: |
          cd kernel || exit 1
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          make oneplus_ace5_ultra_b_defconfig
          scripts/config --disable CONFIG_SUSFS
          if [ "${{ github.event.inputs.kpm }}" = "y" ]; then
            scripts/config --enable CONFIG_KPM
          fi
          make savedefconfig

      - name: Compile Kernel
        run: |
          cd kernel || exit 1
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1
          make -j$(nproc) Image.gz dtbo.img
          mkdir -p ../AnyKernel3
          cp arch/arm64/boot/Image.gz ../AnyKernel3/
          cp arch/arm64/boot/dtbo.img ../AnyKernel3/
          git clone --depth=1 $ANYKERNEL_REPO ../AnyKernel3-Template
          cp -r ../AnyKernel3-Template/* ../AnyKernel3/

      - name: Create Flash Script
        run: |
          # 修复原第136行EOF语法问题，改用echo逐行写入
          echo 'ui_print("Flashing SukiSU Ultra 40129...");' > ../AnyKernel3/META-INF/com/google/android/updater-script
          echo 'package_extract_file("Image.gz", "/dev/block/bootdevice/by-name/boot");' >> ../AnyKernel3/META-INF/com/google/android/updater-script
          echo 'package_extract_file("dtbo.img", "/dev/block/bootdevice/by-name/dtbo");' >> ../AnyKernel3/META-INF/com/google/android/updater-script
          echo 'ui_print("Flashed successfully!");' >> ../AnyKernel3/META-INF/com/google/android/updater-script

      - name: Package Kernel
        run: |
          cd ../AnyKernel3 || exit 1
          zip -r9 SukiSU-Ultra-40129-Ace5-Ultra-${{ github.run_id }}.zip . -x "*.git*" "*.md" "LICENSE"
          mv SukiSU-Ultra-40129-Ace5-Ultra-${{ github.run_id }}.zip ../

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-40129-Kernel.zip
          path: SukiSU-Ultra-40129-Ace5-Ultra-${{ github.run_id }}.zip
          retention-days: 7
